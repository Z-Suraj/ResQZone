<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shelterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#shelterBg)"/>
  <!-- Mountain Silhouette Backdrop -->
  <polygon points="0,320 180,180 380,260 580,150 800,290 800,500 0,500" fill="#022c22" opacity="0.7"/>
  <!-- Safe Relief Center Compound -->
  <rect x="150" y="260" width="500" height="200" rx="10" fill="#0f766e" stroke="#14b8a6" stroke-width="3"/>
  <polygon points="120,260 400,160 680,260" fill="#0d9488"/>
  <!-- Entrance & Windows -->
  <rect x="360" y="340" width="80" height="120" rx="6" fill="#f8fafc"/>
  <rect x="200" y="300" width="70" height="60" rx="4" fill="#5eead4" opacity="0.8"/>
  <rect x="530" y="300" width="70" height="60" rx="4" fill="#5eead4" opacity="0.8"/>
  <!-- Medical Red Cross Flag -->
  <line x1="400" y1="160" x2="400" y2="100" stroke="#ffffff" stroke-width="4"/>
  <rect x="400" y="100" width="60" height="40" fill="#ffffff"/>
  <rect x="424" y="110" width="12" height="20" fill="#ef4444"/>
  <rect x="420" y="114" width="20" height="12" fill="#ef4444"/>
  <!-- Tents in courtyard -->
  <polygon points="80,450 140,360 200,450" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <polygon points="600,450 660,360 720,450" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <!-- Verified Safe Badge -->
  <rect x="25" y="25" width="180" height="34" rx="8" fill="#022c22" opacity="0.9"/>
  <circle cx="45" cy="42" r="7" fill="#10b981"/>
  <text x="60" y="47" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ecfdf5" letter-spacing="1">RELIEF SHELTER</text>
</svg>

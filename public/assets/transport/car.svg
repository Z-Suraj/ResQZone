<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#1e293b"/>
  <rect x="0" y="380" width="800" height="120" fill="#0f172a"/>
  <!-- All-Terrain 4x4 Quick Response Vehicle -->
  <g transform="translate(180, 180)">
    <path d="M 40 100 L 100 40 L 260 40 L 320 80 L 410 90 L 420 160 L 0 160 L 10 110 Z" fill="url(#carGrad)"/>
    <!-- Windows -->
    <polygon points="110,50 170,50 170,90 100,90" fill="#0f172a"/>
    <polygon points="185,50 250,50 250,90 185,90" fill="#0f172a"/>
    <polygon points="265,55 305,85 265,85" fill="#0f172a"/>
    <!-- Emergency Lightbar -->
    <rect x="160" y="25" width="50" height="15" rx="4" fill="#3b82f6"/>
    <rect x="185" y="25" width="25" height="15" rx="4" fill="#ef4444"/>
    <!-- White Stripe & Text -->
    <rect x="0" y="115" width="410" height="18" fill="#ffffff"/>
    <text x="80" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#dc2626" letter-spacing="2">RESCUE SQUAD 42</text>
    <!-- Heavy-duty Tires -->
    <circle cx="90" cy="165" r="38" fill="#020617"/>
    <circle cx="90" cy="165" r="18" fill="#64748b"/>
    <circle cx="330" cy="165" r="38" fill="#020617"/>
    <circle cx="330" cy="165" r="18" fill="#64748b"/>
  </g>
  <!-- Badge -->
  <rect x="25" y="25" width="190" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <circle cx="45" cy="42" r="7" fill="#ef4444"/>
  <text x="60" y="47" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">RESCUE VEHICLE</text>
</svg>

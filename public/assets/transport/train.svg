<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0f172a"/>
  <!-- Railway Track & Bed -->
  <rect x="0" y="380" width="800" height="120" fill="#1e293b"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#94a3b8" stroke-width="8"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#94a3b8" stroke-width="8"/>
  <g stroke="#475569" stroke-width="6">
    <line x1="40" y1="395" x2="40" y2="455"/>
    <line x1="120" y1="395" x2="120" y2="455"/>
    <line x1="200" y1="395" x2="200" y2="455"/>
    <line x1="280" y1="395" x2="280" y2="455"/>
    <line x1="360" y1="395" x2="360" y2="455"/>
    <line x1="440" y1="395" x2="440" y2="455"/>
    <line x1="520" y1="395" x2="520" y2="455"/>
    <line x1="600" y1="395" x2="600" y2="455"/>
    <line x1="680" y1="395" x2="680" y2="455"/>
    <line x1="760" y1="395" x2="760" y2="455"/>
  </g>
  <!-- Streamlined Evacuation Express Train -->
  <g transform="translate(100, 160)">
    <!-- Locomotive / Coach Body -->
    <path d="M 0 60 C 40 30, 560 30, 580 60 L 620 180 L 0 180 Z" fill="url(#trainGrad)"/>
    <!-- Aero Nose -->
    <path d="M 580 60 Q 640 120 620 180 Z" fill="#0369a1"/>
    <!-- Panoramic Windows -->
    <rect x="60" y="70" width="80" height="45" rx="6" fill="#0f172a"/>
    <rect x="160" y="70" width="80" height="45" rx="6" fill="#0f172a"/>
    <rect x="260" y="70" width="80" height="45" rx="6" fill="#0f172a"/>
    <rect x="360" y="70" width="80" height="45" rx="6" fill="#0f172a"/>
    <path d="M 460 70 L 550 70 L 570 115 L 460 115 Z" fill="#020617"/>
    <!-- Stripe -->
    <rect x="0" y="130" width="600" height="12" fill="#f8fafc"/>
    <!-- Undercarriage & Wheels -->
    <circle cx="120" cy="190" r="28" fill="#334155"/>
    <circle cx="200" cy="190" r="28" fill="#334155"/>
    <circle cx="440" cy="190" r="28" fill="#334155"/>
    <circle cx="520" cy="190" r="28" fill="#334155"/>
  </g>
  <!-- Badge -->
  <rect x="25" y="25" width="200" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <circle cx="45" cy="42" r="7" fill="#38bdf8"/>
  <text x="60" y="47" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">EVACUATION TRAIN</text>
</svg>

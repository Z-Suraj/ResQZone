<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#commGrad)"/>
  <!-- Mountain Silhouette -->
  <polygon points="0,320 200,200 440,280 640,160 800,290 800,500 0,500" fill="#0f172a"/>
  <!-- Safe Community Center Building -->
  <rect x="220" y="240" width="360" height="180" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
  <polygon points="190,240 400,160 610,240" fill="#1e293b"/>
  <!-- People Gathering in Safety -->
  <g transform="translate(280, 360)">
    <!-- Person 1 -->
    <circle cx="20" cy="10" r="8" fill="#fbbf24"/>
    <rect x="12" y="20" width="16" height="25" rx="3" fill="#3b82f6"/>
    <!-- Person 2 (Child) -->
    <circle cx="50" cy="22" r="6" fill="#fde047"/>
    <rect x="44" y="30" width="12" height="15" rx="2" fill="#ef4444"/>
    <!-- Person 3 (Elderly with staff) -->
    <circle cx="80" cy="8" r="8" fill="#fbbf24"/>
    <rect x="72" y="18" width="16" height="27" rx="3" fill="#10b981"/>
    <line x1="94" y1="20" x2="94" y2="45" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Volunteer with High-Vis Vest -->
    <circle cx="130" cy="8" r="8" fill="#fbbf24"/>
    <rect x="122" y="18" width="16" height="27" rx="3" fill="#f59e0b"/>
    <line x1="122" y1="26" x2="138" y2="26" stroke="#ffffff" stroke-width="3"/>
  </g>
  <!-- Card Header -->
  <rect x="25" y="25" width="200" height="34" rx="8" fill="#0f172a" opacity="0.9"/>
  <circle cx="45" cy="42" r="7" fill="#10b981"/>
  <text x="60" y="47" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">COMMUNITY SAFETY</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="floodSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="floodWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#091b2e"/>
    </linearGradient>
    <linearGradient id="boatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Sky & Mountains Background -->
  <rect width="800" height="500" fill="url(#floodSky)"/>
  <path d="M 0 280 L 120 180 L 250 240 L 400 130 L 560 220 L 700 150 L 800 240 L 800 500 L 0 500 Z" fill="#0f172a" opacity="0.8"/>
  <path d="M 0 320 L 180 230 L 320 280 L 480 200 L 640 270 L 800 210 L 800 500 L 0 500 Z" fill="#1e293b" opacity="0.9"/>
  <!-- Torrential Rain Lines -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="10, 15" opacity="0.35">
    <line x1="50" y1="0" x2="20" y2="400" />
    <line x1="150" y1="0" x2="120" y2="400" />
    <line x1="250" y1="0" x2="220" y2="400" />
    <line x1="350" y1="0" x2="320" y2="400" />
    <line x1="450" y1="0" x2="420" y2="400" />
    <line x1="550" y1="0" x2="520" y2="400" />
    <line x1="650" y1="0" x2="620" y2="400" />
    <line x1="750" y1="0" x2="720" y2="400" />
  </g>
  <!-- Flooded Water Body -->
  <path d="M 0 350 Q 200 330 400 355 T 800 345 L 800 500 L 0 500 Z" fill="url(#floodWater)"/>
  <path d="M 0 380 Q 220 365 440 385 T 800 375 L 800 500 L 0 500 Z" fill="#0b2036" opacity="0.6"/>
  <!-- Submerged structures / bridge silhouettes -->
  <rect x="80" y="320" width="70" height="60" rx="3" fill="#334155" opacity="0.7"/>
  <polygon points="75,320 115,285 155,320" fill="#dc2626" opacity="0.7"/>
  <!-- Rescue Boat & Responders -->
  <g transform="translate(380, 360)">
    <!-- Boat Hull -->
    <path d="M 0 40 C 20 60, 140 60, 160 40 L 150 20 L 10 20 Z" fill="url(#boatGrad)"/>
    <rect x="15" y="15" width="130" height="7" rx="3" fill="#ffffff" opacity="0.8"/>
    <!-- Responders -->
    <!-- Responder 1 (Steering) -->
    <circle cx="35" cy="5" r="7" fill="#fbbf24"/>
    <rect x="28" y="12" width="14" height="15" rx="3" fill="#e11d48"/>
    <!-- Responder 2 (Spotter) -->
    <circle cx="75" cy="2" r="7" fill="#fbbf24"/>
    <rect x="68" y="9" width="14" height="18" rx="3" fill="#e11d48"/>
    <!-- Evacuee -->
    <circle cx="115" cy="7" r="6" fill="#fde047"/>
    <rect x="109" y="13" width="12" height="14" rx="2" fill="#3b82f6"/>
    <!-- Motor Splash -->
    <ellipse cx="-8" cy="40" rx="10" ry="4" fill="#60a5fa" opacity="0.8"/>
  </g>
  <!-- Warning Water Wave Ripple -->
  <path d="M 320 420 Q 380 410 440 420 T 560 420" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Overlay Banner Label -->
  <rect x="25" y="25" width="180" height="34" rx="8" fill="#0f172a" opacity="0.85"/>
  <circle cx="45" cy="42" r="6" fill="#e11d48"/>
  <text x="60" y="47" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">FLASH FLOOD</text>
</svg>

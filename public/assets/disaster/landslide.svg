<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="slideSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="mountainSlope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#271003"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#slideSky)"/>
  <!-- Rugged Mountain Ridge -->
  <polygon points="0,500 0,160 220,90 420,180 620,80 800,220 800,500" fill="#1e293b"/>
  <!-- Steep Debris Slope -->
  <polygon points="120,500 240,190 480,260 720,500" fill="url(#mountainSlope)"/>
  <!-- Broken Road Segment (NH-58 Blocked) -->
  <path d="M 0 420 L 220 410 L 320 435" stroke="#64748b" stroke-width="26" stroke-linecap="square" fill="none"/>
  <path d="M 520 440 L 680 425 L 800 415" stroke="#64748b" stroke-width="26" stroke-linecap="square" fill="none"/>
  <!-- Boulders & Fallen Rock debris -->
  <circle cx="280" cy="425" r="22" fill="#713f12"/>
  <circle cx="340" cy="438" r="18" fill="#57300a"/>
  <circle cx="410" cy="430" r="32" fill="#3b1d04"/>
  <circle cx="480" cy="445" r="20" fill="#713f12"/>
  <!-- Warning Barricade -->
  <rect x="200" y="380" width="40" height="30" fill="#ef4444" rx="4"/>
  <line x1="200" y1="395" x2="240" y2="395" stroke="#ffffff" stroke-width="4"/>
  <!-- Status Badge -->
  <rect x="25" y="25" width="200" height="34" rx="8" fill="#0f172a" opacity="0.85"/>
  <circle cx="45" cy="42" r="6" fill="#f59e0b"/>
  <text x="60" y="47" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">LANDSLIDE RISK</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Shield Border Gradient -->
    <linearGradient id="lhShieldBorderGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="40%" stop-color="#ff3320"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>

    <!-- River Gradient -->
    <linearGradient id="lhRiverGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0040c8"/>
    </linearGradient>

    <!-- Shield Background -->
    <linearGradient id="lhShieldBgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#060b16"/>
    </linearGradient>

    <clipPath id="lhShieldClip">
      <path d="M 68 18 
               L 106 32
               C 111 43, 114 62, 111 84
               C 107 108, 88 129, 68 140
               C 48 129, 29 108, 25 84
               C 22 62, 25 43, 30 32
               Z"/>
    </clipPath>
  </defs>

  <!-- Left Shield Emblem -->
  <g transform="translate(4, -8)">
    <path d="M 68 18 
             L 106 32
             C 111 43, 114 62, 111 84
             C 107 108, 88 129, 68 140
             C 48 129, 29 108, 25 84
             C 22 62, 25 43, 30 32
             Z" 
          fill="url(#lhShieldBgGrad)"/>

    <g clip-path="url(#lhShieldClip)">
      <polygon points="16,100 30,88 37,93 47,78 56,93 66,86 68,100 16,100" fill="#ffffff"/>
      <polygon points="47,78 56,93 48,93" fill="#cbd5e1"/>
      <polygon points="68,100 70,86 80,93 89,78 99,93 106,88 120,100 68,100" fill="#ffffff"/>
      <polygon points="89,78 99,93 91,93" fill="#94a3b8"/>

      <path d="M 20 96 Q 68 90 116 96 L 116 142 L 20 142 Z" fill="#0b162c"/>

      <!-- River -->
      <path d="M 65 92 C 59 96, 45 99, 36 105 C 27 111, 25 118, 30 126 C 38 136, 58 139, 68 140 C 81 139, 96 132, 96 123 C 97 115, 82 109, 71 106 C 65 104, 61 101, 65 98 Z" 
            fill="url(#lhRiverGrad)"/>
      <path d="M 64 98 C 55 102, 42 107, 47 115 C 53 124, 78 118, 92 129 L 87 133 C 71 122, 47 127, 42 115 C 38 107, 54 100, 63 96 Z" fill="#050a14"/>
    </g>

    <!-- Location Pin -->
    <path d="M 68 50 C 59 50, 52 57, 52 66 C 52 74, 61 83, 68 92 C 75 83, 84 74, 84 66 C 84 57, 77 50, 68 50 Z" fill="#ffffff"/>
    <circle cx="68" cy="65" r="5.5" fill="#e61e2b"/>

    <!-- Shield Border -->
    <path d="M 68 18 
             L 30 32
             C 25 43, 22 62, 25 84
             C 29 108, 48 129, 68 140
             C 88 129, 107 108, 111 84
             C 112 75, 112 66, 111 57"
          stroke="url(#lhShieldBorderGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 108 47 L 106 32 L 88 25" 
          stroke="url(#lhShieldBorderGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Arcs -->
    <path d="M 94 42 A 24 24 0 0 1 119 55" stroke="#ff3b20" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 101 34 A 36 36 0 0 1 130 51" stroke="#ff3828" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 109 26 A 49 49 0 0 1 140 46" stroke="#eb1c24" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark "RESQZONE" (High contrast dark slate for light theme) -->
  <g transform="translate(156, 18)">
    <!-- R -->
    <path d="M 0 55 L 0 5 L 34 5 C 48 5, 56 13, 56 24 C 56 33, 49 40, 41 42 L 57 55 L 39 55 L 26 43 L 16 43 L 16 55 Z M 16 17 L 16 33 L 32 33 C 38 33, 41 30, 41 25 C 41 20, 38 17, 32 17 Z" fill="#0f172a"/>

    <!-- E -->
    <path d="M 66 55 L 66 5 L 107 5 L 107 17 L 82 17 L 82 25 L 103 25 L 103 36 L 82 36 L 82 43 L 107 43 L 107 55 Z" fill="#0f172a"/>

    <!-- S -->
    <path d="M 118 49 C 123 54, 131 56, 140 56 C 151 56, 158 50, 158 43 C 158 35, 152 32, 141 29 C 126 25, 115 21, 115 11 C 115 2, 125 -3, 138 -3 C 148 -3, 155 0, 160 5 L 152 15 C 148 12, 143 10, 137 10 C 131 10, 128 13, 128 17 C 128 21, 133 24, 144 27 C 160 31, 171 36, 171 46 C 171 56, 160 63, 146 63 C 134 63, 124 60, 117 54 Z" fill="#0f172a"/>

    <!-- Q with Navigation Arrow Cursor -->
    <g transform="translate(214, 30)">
      <circle cx="0" cy="0" r="29" stroke="#ff2038" stroke-width="11" fill="none"/>
      <!-- Pointer cursor -->
      <path d="M -4 3 L 21 25 L 5 26 L 3 34 Z" fill="#ff2038"/>
      <path d="M -8 -1 L 13 18 L 1 19 L -1 25 Z" fill="#ff4055"/>
    </g>

    <!-- Z -->
    <path d="M 254 55 L 254 44 L 280 17 L 255 17 L 255 5 L 296 5 L 296 15 L 271 43 L 297 43 L 297 55 Z" fill="#0f172a"/>

    <!-- O -->
    <path d="M 308 30 C 308 14, 319 3, 335 3 C 351 3, 362 14, 362 30 C 362 46, 351 57, 335 57 C 319 57, 308 46, 308 30 Z M 347 30 C 347 20, 342 15, 335 15 C 328 15, 323 20, 323 30 C 323 40, 328 45, 335 45 C 342 45, 347 40, 347 30 Z" fill="#0f172a"/>

    <!-- N -->
    <path d="M 373 55 L 373 5 L 388 5 L 409 38 L 409 5 L 424 5 L 424 55 L 409 55 L 388 22 L 388 55 Z" fill="#0f172a"/>

    <!-- E -->
    <path d="M 435 55 L 435 5 L 476 5 L 476 17 L 451 17 L 451 25 L 472 25 L 472 36 L 451 36 L 451 43 L 476 43 L 476 55 Z" fill="#0f172a"/>

    <!-- Subtitle: Safer People. Safer Communities. -->
    <text x="0" y="86" 
          fill="#475569" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="1.8">
      Safer People. Safer Communities.
    </text>
  </g>
</svg>

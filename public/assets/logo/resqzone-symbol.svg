<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Shield Border Gradient (Orange-Red) -->
    <linearGradient id="shieldBorderGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="40%" stop-color="#ff3320"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>

    <!-- River/Highway Gradient (Cyan to Deep Royal Blue) -->
    <linearGradient id="riverGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0040c8"/>
    </linearGradient>

    <!-- Dark Shield Interior -->
    <linearGradient id="shieldBgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#091224"/>
      <stop offset="100%" stop-color="#060b16"/>
    </linearGradient>

    <!-- Pin Shadow -->
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Shield Glow for Dark Mode -->
    <filter id="shieldGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff3320" flood-opacity="0.25"/>
    </filter>

    <clipPath id="shieldInnerClip">
      <path d="M 300 76 
               L 412 118
               C 426 150, 436 210, 428 274
               C 418 348, 360 410, 300 442
               C 240 410, 182 348, 172 274
               C 164 210, 174 150, 188 118
               Z"/>
    </clipPath>
  </defs>

  <g filter="url(#shieldGlow)">
    <!-- Shield Interior Fill -->
    <path d="M 300 76 
             L 412 118
             C 426 150, 436 210, 428 274
             C 418 348, 360 410, 300 442
             C 240 410, 182 348, 172 274
             C 164 210, 174 150, 188 118
             Z" 
          fill="url(#shieldBgGrad)"/>

    <!-- Clipped Internal Elements: Mountains and River -->
    <g clip-path="url(#shieldInnerClip)">
      <!-- Mountain Range Silhouette (Left & Right Peaks) -->
      <!-- Left Mountain Range -->
      <polygon points="140,310 185,280 205,295 235,248 265,295 295,275 300,310 140,310" 
               fill="#ffffff"/>
      <!-- Left Mountain Shadow Facet -->
      <polygon points="235,248 265,295 240,295" 
               fill="#e2e8f0" opacity="0.85"/>
      
      <!-- Right Mountain Range -->
      <polygon points="300,310 305,275 335,295 365,248 395,295 415,280 460,310 300,310" 
               fill="#ffffff"/>
      <!-- Right Mountain Shadow Facet -->
      <polygon points="365,248 395,295 370,295" 
               fill="#cbd5e1" opacity="0.85"/>

      <!-- Lower Mountain Base -->
      <path d="M 160 300 Q 300 280 440 300 L 440 450 L 160 450 Z" fill="#0b162c"/>

      <!-- Flowing Perspective S-Curved Blue River / Evacuation Route -->
      <!-- Main River Body -->
      <path d="M 292 292
               C 275 305, 230 315, 205 332
               C 175 352, 168 375, 185 398
               C 210 430, 270 440, 300 444
               C 340 440, 385 418, 388 390
               C 390 365, 345 345, 308 335
               C 290 330, 280 320, 292 308
               Z"
            fill="url(#riverGrad)"/>

      <!-- Top River Feeder Stream Under Pin -->
      <path d="M 295 285 Q 290 295 275 306 Q 308 310 305 285 Z" fill="#38bdf8"/>

      <!-- Stylized Road/River Divider Groove (Dark Contrast Curve) -->
      <path d="M 288 312
               C 260 325, 220 340, 235 365
               C 255 395, 330 375, 375 410
               L 360 422
               C 310 388, 235 405, 218 368
               C 205 340, 255 320, 282 305
               Z"
            fill="#050a14" opacity="0.95"/>

      <!-- Secondary Water Highlight Ribbon -->
      <path d="M 205 375 C 220 355, 270 345, 310 360 C 350 375, 365 395, 365 405" 
            stroke="#7dd3fc" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Center White Location Pin (Marker) with Red Core -->
    <g filter="url(#pinShadow)">
      <!-- Outer White Pin Shell -->
      <path d="M 300 178
               C 272 178, 250 200, 250 228
               C 250 252, 276 278, 300 308
               C 324 278, 350 252, 350 228
               C 350 200, 328 178, 300 178
               Z"
            fill="#ffffff"/>
      <!-- Inner Red Emergency Dot -->
      <circle cx="300" cy="226" r="18" fill="#e61e2b"/>
      <!-- Inner Dot Reflection Highlight -->
      <circle cx="295" cy="220" r="5" fill="#ff6b6b" opacity="0.8"/>
    </g>

    <!-- Protective Shield Outer Border (Thick Vibrant Gradient with Break for Waves) -->
    <!-- Left Shield Edge & Crest (continuous thick stroke) -->
    <path d="M 300 76 
             L 188 118
             C 174 150, 164 210, 172 274
             C 182 348, 240 410, 300 442
             C 360 410, 418 348, 428 274
             C 432 245, 432 215, 428 185"
          stroke="url(#shieldBorderGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Upper Right Shield Continuation & Antenna Notch -->
    <path d="M 416 160 L 412 118 L 360 98" 
          stroke="url(#shieldBorderGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Emergency Radio Broadcast Waves (3 Arcs radiating from top-right) -->
    <!-- Inner Arc -->
    <path d="M 378 145 A 72 72 0 0 1 454 185" 
          stroke="#ff3b20" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Middle Arc -->
    <path d="M 398 120 A 110 110 0 0 1 488 172" 
          stroke="#ff3828" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Outer Arc -->
    <path d="M 424 95 A 150 150 0 0 1 522 158" 
          stroke="#eb1c24" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>

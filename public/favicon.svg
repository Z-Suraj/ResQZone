      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="40%" stop-color="#ff3320"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
    <linearGradient id="favRiverGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>

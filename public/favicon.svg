  </g>
  <!-- Location Pin -->
  <path d="M 64 42 C 55 42, 48 49, 48 58 C 48 66, 57 75, 64 84 C 71 75, 80 66, 80 58 C 80 49, 73 42, 64 42 Z" fill="#ffffff"/>
  <circle cx="64" cy="56" r="5.5" fill="#e61e2b"/>
